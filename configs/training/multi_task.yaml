# =============================================================================
# Multi-task training configuration
# =============================================================================
# Only overrides training.* keys from default.yaml.
# project.* keys (batch_size, num_workers) live exclusively in default.yaml.
#
# Key differences from single_task:
#   - Lower LR (5e-5) for stability across 4 datasets
#   - Longer warmup (15 epochs) — more tasks to stabilise
#   - More patience (20 epochs) — multi-task convergence is slower
#   - ReduceLROnPlateau as fallback scheduler option
# =============================================================================
training:
  mode: multi_task
  epochs: 100
  lr: 5.0e-5
  min_lr: 1.0e-7
  weight_decay: 0.05
  warmup_epochs: 15
  grad_clip: 1.0
  label_smoothing: 0.1
  use_amp: true
  scheduler: cosine_warmup
  plateau_factor: 0.5
  plateau_patience: 10
  plateau_min_lr: 1.0e-7
  patience: 20
  save_best_metric: avg_f1_macro
  # Contrastive domain discovery (off by default — enable explicitly via
  # multi_task_contrastive.yaml for the autonomous-inference feature).
  use_contrastive: true
  # lambda=0.5: was 0.1 — backbone received only ~17% of total loss from
  # SupCon; at 0.5 the domain-separation signal is ~50% of total, giving
  # the backbone enough gradient to actually separate modality features.
  contrastive_lambda: 0.5
  # temp=0.15: was 0.07 — very low temperature causes near-zero gradients
  # in the SupCon softmax denominator when all negatives are far apart.
  # 0.15 keeps the gradient live throughout training.
  contrastive_temp: 0.15
  # warmup=5: was 10 — start domain separation earlier so the backbone
  # doesn't lock into a purely class-discriminative representation first.
  contrastive_warmup: 5
  compute_prototypes_after_training: true